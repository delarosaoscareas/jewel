<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Jewel Bloom</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --card-bg: #ffffff;
      --accent: #ec4899;
      --text-main: #1f2933;
      --text-muted: #6b7280;
      --border-soft: rgba(236,72,153,.18);
      --radius-lg: 18px;
      --radius-md: 12px;
      --shadow-soft: 0 16px 40px rgba(148,27,126,.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, sans-serif;
    }

    body {
      background: linear-gradient(to bottom, #fdf2f8, #f9fafb);
      min-height: 100vh;
      color: var(--text-main);
    }

    header {
      padding: 16px;
      background: #fff;
      border-bottom: 1px solid #fbcfe8;
    }

    main {
      padding: 16px;
      max-width: 1100px;
      margin: auto;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-soft);
      box-shadow: var(--shadow-soft);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .product-image {
      height: 150px;
      border-radius: var(--radius-md);
      overflow: hidden;
      position: relative;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .product-title {
      font-weight: 600;
      font-size: 0.95rem;
      text-transform: capitalize;
    }

    .product-description {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .price-box {
      background: #fdf2f8;
      border: 1px dashed #f9a8d4;
      border-radius: var(--radius-md);
      padding: 8px;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .price-line strong {
      color: #9d174d;
    }
  </style>
</head>

<body>

<header>
  <h1>Jewel Bloom — Price List</h1>
</header>

<main>
  <section class="products" id="productsGrid"></section>
</main>

<script>
  const productsData = [
    {
      id: 1,
      name: "harmony",
      image: "images/1.png",
      description: "Delicate everyday piece.",
      prices: [
        "Without packaging: $8 each",
        "With packaging: $10"
      ]
    },
    {
      id: 2,
      name: "day and night",
      image: "images/2.png",
      description: "Minimal and versatile.",
      prices: [
        "Without packaging: $8 each",
        "With packaging: $10"
      ]
    },
    {
      id: 3,
      name: "moonstone",
      image: "images/3.png",
      description: "Necklace + bracelet set.",
      prices: [
        "Without packaging: $20 (necklace $12 + bracelet $8)",
        "With packaging: $22 both / $14 necklace / $10 bracelet"
      ]
    },
    {
      id: 4,
      name: "joy",
      image: "images/4.png",
      description: "Real pearls.",
      prices: [
        "Without packaging: $15",
        "With packaging: $10"
      ]
    },
    {
      id: 5,
      name: "honey",
      image: "images/5.png",
      description: "Sweet and minimal.",
      prices: [
        "Without packaging: $12",
        "With packaging: $10"
      ]
    },
    {
      id: 6,
      name: "cosmos duo",
      image: "images/6.png",
      description: "Real pearls – duo set.",
      prices: [
        "Without packaging: $10 each",
        "With packaging: $12"
      ]
    }
  ];

  const grid = document.getElementById("productsGrid");

  productsData.forEach(p => {
    const card = document.createElement("article");
    card.className = "product-card";

    card.innerHTML = `
      <div class="product-image">
        <img src="${p.image}" alt="${p.name}">
      </div>
      <h2 class="product-title">${p.name}</h2>
      <p class="product-description">${p.description}</p>
      <div class="price-box">
        ${p.prices.map(line => `<div class="price-line"><strong>•</strong> ${line}</div>`).join("")}
      </div>
    `;

    grid.appendChild(card);
  });
</script>

</body>
</html>
