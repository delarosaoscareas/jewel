<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Jewel Bloom</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root {
  --card-bg: #ffffff;
  --accent: #ec4899;
  --text-main: #1f2933;
  --text-muted: #6b7280;
  --border-soft: rgba(236,72,153,.18);
  --radius-lg: 18px;
  --radius-md: 12px;
  --shadow-soft: 0 16px 40px rgba(148,27,126,.16);
}

* { box-sizing:border-box; margin:0; padding:0; font-family:system-ui; }

body {
  background: linear-gradient(to bottom,#fdf2f8,#f9fafb);
  min-height:100vh;
}

header {
  padding:16px;
  background:#fff;
  border-bottom:1px solid #fbcfe8;
}

header h1 { font-size:1.2rem; }

main { padding:16px; max-width:1100px; margin:auto; }

.products {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:16px;
}

.product-card {
  background:var(--card-bg);
  border-radius:var(--radius-lg);
  border:1px solid var(--border-soft);
  box-shadow:var(--shadow-soft);
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.product-image {
  height:150px;
  border-radius:var(--radius-md);
  overflow:hidden;
  position:relative;
}

.product-image img {
  width:100%;
  height:100%;
  object-fit:cover;
}

.product-chip {
  position:absolute;
  top:8px;
  left:8px;
  background:#fff;
  padding:4px 10px;
  border-radius:999px;
  font-size:.65rem;
  border:1px solid #f9a8d4;
}

.product-title { font-weight:600; }
.product-description { font-size:.85rem; color:var(--text-muted); }

.product-footer {
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.heart-btn {
  border:none;
  background:#fee2e2;
  border-radius:999px;
  padding:6px 12px;
  cursor:pointer;
  font-size:1.1rem;
}
.heart-btn.active { background:#fda4af; }
</style>
</head>

<body>

<header>
  <h1>Jewel Bloom — Demo</h1>
</header>

<main>
  <section class="products" id="productsGrid"></section>
</main>

<script>
const productsData = [
  {
    id:"1",
    name:"Aurora Necklace",
    price:120,
    tag:"Limited",
    description:"18k gold-plated chain with crystal detail.",
    image:"https://drive.google.com/file/d/10LTAta9AanBv5ezZgLg-ohsYF3mjzx0e/view?usp=sharing"
  },
  {
    id:"2",
    name:"Minimal Gold Bracelet",
    price:85,
    tag:"Best seller",
    description:"Delicate adjustable bracelet.",
    image:"https://images.unsplash.com/photo-1617038220319-276d3f0f2f02?auto=format&fit=crop&w=800&q=80"
  },
  {
    id:"3",
    name:"Moon Pearl Earrings",
    price:95,
    tag:"Classic",
    description:"Soft-shine pearl earrings.",
    image:"https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?auto=format&fit=crop&w=800&q=80"
  },
  {
    id:"4",
    name:"Eclipse Ring",
    price:150,
    tag:"New",
    description:"Adjustable ring with stones.",
    image:"https://images.unsplash.com/photo-1617038268404-53b93a3a7c21?auto=format&fit=crop&w=800&q=80"
  },
  {
    id:"5",
    name:"Starlight Choker",
    price:110,
    tag:"Trending",
    description:"Fine choker with star details.",
    image:"https://images.unsplash.com/photo-1585386959984-a41552231691?auto=format&fit=crop&w=800&q=80"
  },
  {
    id:"6",
    name:"Night Glow Set",
    price:210,
    tag:"Set",
    description:"Necklace + earrings combo.",
    image:"https://images.unsplash.com/photo-1617038310865-21ed7b5e2ad6?auto=format&fit=crop&w=800&q=80"
  }
];

const grid = document.getElementById("productsGrid");

productsData.forEach(p => {
  const card = document.createElement("div");
  card.className = "product-card";
  card.innerHTML = `
    <div class="product-image">
      <img src="${p.image}" alt="${p.name}">
      <span class="product-chip">${p.tag}</span>
    </div>
    <div class="product-title">${p.name}</div>
    <div class="product-description">${p.description}</div>
    <div class="product-footer">
      <strong>Q ${p.price}</strong>
      <button class="heart-btn">♡</button>
    </div>
  `;
  grid.appendChild(card);
});

grid.addEventListener("click", e => {
  if(!e.target.classList.contains("heart-btn")) return;
  e.target.classList.toggle("active");
  e.target.textContent = e.target.classList.contains("active") ? "♥" : "♡";
});
</script>

</body>
</html>
