<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Stardazed Jewelry</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root{
  --bg:#fdf2f8;
  --card:#ffffff;
  --accent:#ec4899;
  --heart:#ec4899;
  --text:#1f2933;
  --muted:#6b7280;
  --border:rgba(236,72,153,.25);
  --r-lg:18px;
  --r-md:12px;
  --shadow:0 16px 40px rgba(148,27,126,.16);
}

*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}

body{
  background:linear-gradient(#fdf2f8,#f9fafb);
  min-height:100vh;
  color:var(--text);
}

header{
  padding:16px;
  background:#fff;
  border-bottom:1px solid #fbcfe8;
}

header h1{font-size:1.2rem}

main{
  padding:16px;
  max-width:1100px;
  margin:auto;
}

.layout{
  display:grid;
  gap:16px;
}

@media(min-width:840px){
  .layout{grid-template-columns:2fr 1fr}
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:16px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow);
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.image{
  height:150px;
  border-radius:var(--r-md);
  overflow:hidden;
}

.image img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.title{
  font-weight:600;
  text-transform:capitalize;
}

.footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.price{
  font-weight:600;
  color:#9d174d;
}

.heart-btn{
  border:none;
  background:#fee2e2;
  border-radius:999px;
  padding:6px 12px;
  font-size:1.2rem;
  cursor:pointer;
  transition:transform .15s ease;
}

.heart-btn.active{
  background:#fda4af;
  color:var(--heart);
}

.sidebar{
  background:#fff;
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow);
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.list{
  list-style:none;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.item{
  display:flex;
  justify-content:space-between;
  background:#fdf2f8;
  border-radius:8px;
  padding:6px;
}

.total{
  display:flex;
  justify-content:space-between;
  border-top:1px dashed #f9a8d4;
  padding-top:8px;
  font-weight:600;
}
</style>
</head>

<body>

<header>
  <h1>Stardazed Jewelry</h1>
</header>

<main>
<div class="layout">
  <section class="products" id="products"></section>

  <aside class="sidebar">
    <strong>My hearts</strong>
    <ul class="list" id="favorites"></ul>
    <div class="total">
      <span>Total</span>
      <span id="total">$0</span>
    </div>
  </aside>
</div>
</main>

<script>
const products = [
  {id:1,name:"harmony",price:10,img:"images/1.png"},
  {id:2,name:"day and night",price:10,img:"images/2.png"},
  {id:3,name:"moonstone",price:22,img:"images/3.png"},
  {id:4,name:"joy",price:10,img:"images/4.png"},
  {id:5,name:"honey",price:10,img:"images/5.png"},
  {id:6,name:"cosmos duo",price:12,img:"images/6.png"}
];

const selected = {};
const productsEl = document.getElementById("products");
const listEl = document.getElementById("favorites");
const totalEl = document.getElementById("total");

products.forEach(p=>{
  const card=document.createElement("article");
  card.className="card";
  card.innerHTML=`
    <div class="image">
      <img src="${p.img}" alt="${p.name}">
    </div>
    <div class="title">${p.name}</div>
    <div class="footer">
      <span class="price">$${p.price}</span>
      <button class="heart-btn" data-id="${p.id}">♡</button>
    </div>
  `;
  productsEl.appendChild(card);
});

productsEl.addEventListener("click",e=>{
  const btn=e.target.closest(".heart-btn");
  if(!btn) return;

  const id=btn.dataset.id;
  const product=products.find(p=>p.id==id);

  if(selected[id]){
    delete selected[id];
    btn.classList.remove("active");
    btn.textContent="♡";
  }else{
    selected[id]=product;
    btn.classList.add("active");
    btn.textContent="♥";
  }

  render();
});

function render(){
  listEl.innerHTML="";
  let total=0;

  Object.values(selected).forEach(p=>{
    total+=p.price;
    const li=document.createElement("li");
    li.className="item";
    li.innerHTML=`<span>${p.name}</span><span>$${p.price}</span>`;
    listEl.appendChild(li);
  });

  totalEl.textContent="$"+total;
}
</script>

</body>
</html>
