<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Jewel Bloom</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --bg: #fdf2f8;
      --card-bg: #ffffff;
      --accent: #ec4899;
      --heart: #ec4899;
      --text-main: #1f2933;
      --text-muted: #6b7280;
      --border-soft: rgba(236,72,153,.18);
      --radius-lg: 18px;
      --radius-md: 12px;
      --shadow-soft: 0 16px 40px rgba(148,27,126,.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(to bottom, #fdf2f8, #f9fafb);
      color: var(--text-main);
    }

    header {
      padding: 16px;
      background: #fff;
      border-bottom: 1px solid #fbcfe8;
    }

    header h1 {
      font-size: 1.2rem;
    }

    main {
      padding: 16px;
      max-width: 1100px;
      margin: auto;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-soft);
      box-shadow: var(--shadow-soft);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .product-image {
      height: 150px;
      border-radius: var(--radius-md);
      overflow: hidden;
      position: relative;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .product-chip {
      position: absolute;
      top: 8px;
      left: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.95);
      font-size: 0.65rem;
      border: 1px solid rgba(236,72,153,.35);
    }

    .product-title {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .product-description {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .product-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
    }

    .heart-btn {
      border: none;
      background: #fee2e2;
      border-radius: 999px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 1.2rem;
      transition: transform .15s ease;
    }

    .heart-btn.active {
      background: #fda4af;
      color: var(--heart);
    }

    .heart-btn:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>

<header>
  <h1>Jewel Bloom — Demo</h1>
</header>

<main>
  <section class="products" id="productsGrid"></section>
</main>

<script>
  const productsData = [
    {
      id: "1",
      name: "Aurora Necklace",
      price: 120,
      tag: "Limited",
      description: "18k gold-plated chain with crystal detail.",
      image: "images/1.png"
    },
    {
      id: "2",
      name: "Minimal Gold Bracelet",
      price: 85,
      tag: "Best seller",
      description: "Delicate adjustable bracelet.",
      image: "images/2.png"
    },
    {
      id: "3",
      name: "Moon Pearl Earrings",
      price: 95,
      tag: "Classic",
      description: "Soft-shine pearl earrings.",
      image: "images/3.png"
    },
    {
      id: "4",
      name: "Eclipse Ring",
      price: 150,
      tag: "New",
      description: "Adjustable ring with stones.",
      image: "images/4.png"
    },
    {
      id: "5",
      name: "Starlight Choker",
      price: 110,
      tag: "Trending",
      description: "Fine choker with star details.",
      image: "images/5.png"
    },
    {
      id: "6",
      name: "Night Glow Set",
      price: 210,
      tag: "Set",
      description: "Necklace + earrings combo.",
      image: "images/6.png"
    }
  ];

  const grid = document.getElementById("productsGrid");

  productsData.forEach(p => {
    const card = document.createElement("article");
    card.className = "product-card";

    card.innerHTML = `
      <div class="product-image">
        <img src="${p.image}" alt="${p.name}">
        <span class="product-chip">${p.tag}</span>
      </div>
      <h2 class="product-title">${p.name}</h2>
      <p class="product-description">${p.description}</p>
      <div class="product-footer">
        <strong>Q ${p.price.toFixed(2)}</strong>
        <button class="heart-btn">♡</button>
      </div>
    `;

    grid.appendChild(card);
  });

  grid.addEventListener("click", e => {
    const btn = e.target.closest(".heart-btn");
    if (!btn) return;
    btn.classList.toggle("active");
    btn.textContent = btn.classList.contains("active") ? "♥" : "♡";
  });
</script>

</body>
</html>
